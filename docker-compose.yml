services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: equity-research-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount vector DB so indexed articles persist on host across container restarts
      - ./chroma_data:/app/chroma_data
    restart: unless-stopped